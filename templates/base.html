<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Content Security Policy para mitigar XSS (ajuste conforme necessário) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https:;">
    <title>{% block title %}CS:GO Store{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/global.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/navbar.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/hero.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/sobre-nos.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/como-funciona.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/faq.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/footer.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/responsive.css') }}" rel="stylesheet">
</head>
<body>
  <!-- CSRF token global para uso em JS -->
  <input type="hidden" id="csrf_token" value="{{ csrf_token }}">

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo FortuneSkins" height="30">
            <span class="ms-2" style="color: #fff; font-weight: bold;">FortuneSkins</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/market">VENDER AGORA</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/faq">SUPORTE 24H</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="/faq">FAQ</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3 flex-wrap">
                <!-- Idioma -->
                <div class="dropdown">
                    <button class="btn btn-dark dropdown-toggle no-border d-flex align-items-center" type="button" id="languageDropdown" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Selecionar idioma">
                        <img src="{{ url_for('static', filename='images/flags/en.svg') }}" alt="English" height="20" class="me-1">
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item d-flex align-items-center" href="#">
                                <img src="{{ url_for('static', filename='images/flags/us.svg') }}" height="20" class="me-2" alt="English"> English
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item d-flex align-items-center" href="#">
                                <img src="{{ url_for('static', filename='images/flags/br.svg') }}" height="20" class="me-2" alt="Português"> Português
                            </a>
                        </li>
                    </ul>
                </div>
                <!-- Moeda -->
                <div class="dropdown">
                    <button class="btn btn-dark dropdown-toggle no-border" type="button" id="currencyDropdown" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Selecionar moeda">
                        $ USD
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#">$ USD</a></li>
                        <li><a class="dropdown-item" href="#">R$ BRL</a></li>
                    </ul>
                </div>
                <!-- Botão de login com logo Steam -->
                <a href="/login" class="btn text-light d-flex align-items-center">
                    <img src="{{ url_for('static', filename='images/steam-icon-azul.svg') }}" alt="Steam" height="20" class="me-2">
                    Login Steam
                </a>
            </div>
        </div>
    </div>
  </nav>
  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>
      AOS.init();
  </script>
  <!-- Bloco para conteúdo específico de cada página -->
  {% block content %}
  {% endblock %}
  <!-- Bloco para scripts customizados de cada página -->
  {% block scripts %}{% endblock %}
</body>
</html>
